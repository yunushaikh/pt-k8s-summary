name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.8.1) — use when a tag push run failed or was queued too long"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve ref and version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$REF" =~ ^v ]]; then
            echo "Tag must start with v (got: $REF)" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "Release ref: $REF (version ${REF#v})"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: pt-k8s-summary/go.sum

      - name: Build release binaries
        env:
          VERSION: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd pt-k8s-summary
          mkdir -p ../dist
          LDFLAGS="-s -w -X pt-k8s-summary/internal/version.Version=${VERSION} -X pt-k8s-summary/internal/version.Commit=${COMMIT::7}"
          build_one() {
            local goos=$1 goarch=$2
            echo "Building ${goos}/${goarch}..."
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath \
              -ldflags "$LDFLAGS" \
              -o "../dist/pt-k8s-summary_${goos}_${goarch}" .
          }
          build_one linux amd64
          build_one linux arm64
          build_one darwin amd64
          build_one darwin arm64
          cd ../dist
          chmod +x pt-k8s-summary_*
          sha256sum pt-k8s-summary_* > SHA256SUMS
          ls -la

      - name: Extract CHANGELOG section
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "Release notes for ${TAG} not found in CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "## Downloads (this release)"
            echo ""
            echo "| Platform | Asset |"
            echo "|----------|-------|"
            echo "| Linux x86_64 | \`pt-k8s-summary_linux_amd64\` |"
            echo "| Linux ARM64 | \`pt-k8s-summary_linux_arm64\` |"
            echo "| macOS Intel | \`pt-k8s-summary_darwin_amd64\` |"
            echo "| macOS Apple Silicon | \`pt-k8s-summary_darwin_arm64\` |"
            echo ""
            echo "Verify with \`SHA256SUMS\`. See [docs/INSTALL.md](https://github.com/yunushaikh/pt-k8s-summary/blob/main/docs/INSTALL.md) for install and [docs/USAGE.md](https://github.com/yunushaikh/pt-k8s-summary/blob/main/docs/USAGE.md) for usage."
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.ref }}
          body_path: release-notes.md
          files: |
            dist/pt-k8s-summary_linux_amd64
            dist/pt-k8s-summary_linux_arm64
            dist/pt-k8s-summary_darwin_amd64
            dist/pt-k8s-summary_darwin_arm64
            dist/SHA256SUMS
          generate_release_notes: false
